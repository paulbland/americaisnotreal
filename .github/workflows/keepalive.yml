name: Keepalive

# GitHub disables scheduled workflows in repos with no commits for 60 days. The
# daily scan commits on most days, but if the news ever goes quiet for two
# months this empty commit keeps the schedule alive.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
